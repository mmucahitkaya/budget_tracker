name: Budget Tracker
version: "1.0.2"
slug: budget_tracker
description: >-
  Household budget tracker: reads receipts and card statements with a local AI model,
  tracks cards, installments, recurring bills, budgets, plans and savings insights.
url: https://github.com/mmucahitkaya/budget_tracker
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:wallet-outline
panel_title: Budget
# Non-admin Home Assistant users (e.g. your partner) can open the panel too
panel_admin: false
homeassistant_api: true
hassio_api: true
backup: hot
options:
  ollama_url: ""
  ollama_model: qwen3-vl:8b-instruct
  telegram_bot_token: ""
  telegram_auto_delete_hours: 24
  allowed_users: []
  notify_services: []
  notify_time: "09:00"
  timezone: ""
schema:
  ollama_url: str?
  ollama_model: str
  telegram_bot_token: password?
  telegram_auto_delete_hours: int(0,47)
  allowed_users:
    - str
  notify_services:
    - str
  notify_time: match(^\d{2}:\d{2}$)
  timezone: str?
